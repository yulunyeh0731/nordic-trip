<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15293A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="北境冬旅">
<title>北境冬旅｜旅遊手冊</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --night:#15293A; --frost:#EEF2F4; --paper:#FBFCFC; --ink:#1F2A33; --ink-dim:#56636E;
  --line:rgba(31,42,51,.14); --line-soft:rgba(31,42,51,.08);
  --aurora:#1D8A68; --brick:#9A4A2F; --fjord:#1F4E6B; --amber:#9A6A10; --rust:#A63A2C;
  --ok-bg:rgba(29,138,104,.13); --ok:#136B50;
  --wait-bg:rgba(185,127,23,.16); --wait:#7E560C;
  --self-bg:rgba(31,78,107,.11); --self:#1F4E6B;
  --bad-bg:rgba(166,58,44,.12); --bad:#8E2F23;
  --sky-ink:#EEF3F6; --sky-sub:#B9C8D3; --sky-dim:#9FB2C0;
  --l1:#5DCAA5; --l2:#1D9E75; --l3:#AFA9EC;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --head:"Songti TC","Noto Serif TC","PMingLiU",var(--sans);
  --tabh:58px;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --night:#0B1824;--frost:#0E1C28;--paper:#15283A;--ink:#E6EDF2;--ink-dim:#A3B3C0;
    --line:rgba(230,237,242,.14);--line-soft:rgba(230,237,242,.08);
    --aurora:#5DCAA5;--brick:#D98A6C;--fjord:#8DB9D6;--amber:#E2B25E;--rust:#EE8B7C;
    --ok-bg:rgba(93,202,165,.16);--ok:#8FE0C2;--wait-bg:rgba(226,178,94,.18);--wait:#F0CC8A;
    --self-bg:rgba(141,185,214,.16);--self:#B5D4EA;--bad-bg:rgba(238,139,124,.16);--bad:#F4AFA4;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --night:#0B1824;--frost:#0E1C28;--paper:#15283A;--ink:#E6EDF2;--ink-dim:#A3B3C0;
  --line:rgba(230,237,242,.14);--line-soft:rgba(230,237,242,.08);
  --aurora:#5DCAA5;--brick:#D98A6C;--fjord:#8DB9D6;--amber:#E2B25E;--rust:#EE8B7C;
  --ok-bg:rgba(93,202,165,.16);--ok:#8FE0C2;--wait-bg:rgba(226,178,94,.18);--wait:#F0CC8A;
  --self-bg:rgba(141,185,214,.16);--self:#B5D4EA;--bad-bg:rgba(238,139,124,.16);--bad:#F4AFA4;
}
/* 極光觀測模式 */
html:root[data-mode="red"]{
  color-scheme:dark;
  --night:#000;--frost:#000;--paper:#0A0101;--ink:#C2412F;--ink-dim:#7D2A1F;
  --line:rgba(194,65,47,.28);--line-soft:rgba(194,65,47,.14);
  --aurora:#C2412F;--brick:#C2412F;--fjord:#C2412F;--amber:#C2412F;--rust:#C2412F;
  --ok-bg:rgba(194,65,47,.14);--ok:#C2412F;--wait-bg:rgba(194,65,47,.14);--wait:#C2412F;
  --self-bg:rgba(194,65,47,.14);--self:#C2412F;--bad-bg:rgba(194,65,47,.2);--bad:#E0503C;
  --sky-ink:#C2412F;--sky-sub:#8E2F23;--sky-dim:#7D2A1F;--l1:#5A140D;--l2:#3E0E09;--l3:#4A110B;
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--frost);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px))}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
:focus-visible{outline:2px solid var(--fjord);outline-offset:2px}

/* 上方列 */
.top{position:sticky;top:0;z-index:20;background:var(--frost);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:50px}
.top h1{flex:1;min-width:0;margin:0;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;border:1px solid var(--line);background:var(--paper);border-radius:3px;font-size:14px;cursor:pointer}
.mode i{width:9px;height:9px;border-radius:50%;background:#C2412F}

/* 下方分頁 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh);padding:0 4px}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--ink-dim);font-size:12px;line-height:1.2}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--aurora);font-weight:500}

/* 頁首夜空（總覽頁） */
.sky{background:var(--night);color:var(--sky-ink);overflow:hidden}
.sky svg{display:block;width:100%;height:80px}
.sky path{fill:none;stroke-linecap:round}
.sky .a1{stroke:var(--l1)} .sky .a2{stroke:var(--l2)} .sky .a3{stroke:var(--l3)}
.drift{animation:drift 26s ease-in-out infinite alternate}
.drift2{animation:drift 34s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@media (prefers-reduced-motion:reduce){.drift,.drift2{animation:none}}
.sky .t{padding-bottom:22px}
.sky h2{font-family:var(--head);font-weight:900;font-size:clamp(34px,10vw,44px);line-height:1.1;margin:0;letter-spacing:.08em}
.sky .sub{margin:6px 0 0;font-size:14.5px;color:var(--sky-sub)}
.status{margin:12px 0 0;font-size:15px;border-left:2px solid var(--l1);padding-left:10px;line-height:1.6}
.route{margin:18px 0 0;overflow-x:auto;scrollbar-width:none}
.route::-webkit-scrollbar{display:none}
.route ol{list-style:none;margin:0;padding:0;display:flex;min-width:max-content}
.route li{position:relative;padding:20px 11px 0;text-align:center;white-space:nowrap}
.route li::before{content:"";position:absolute;top:8px;left:0;right:0;height:1px;background:var(--sky-dim);opacity:.5}
.route li:first-child::before{left:50%}
.route li:last-child::before{right:50%}
.route li::after{content:"";position:absolute;top:4px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--sky-ink)}
.route li.polar::after{background:var(--l1);box-shadow:0 0 0 4px rgba(93,202,165,.18)}
.route li.solo::after{background:var(--night);border:1.5px solid var(--sky-ink)}
.route li.solo b{color:var(--sky-sub)}
.route b{display:block;font-weight:500;font-size:14px}
.route span{font-size:12px;color:var(--sky-dim)}

/* 總覽清單 */
.list{list-style:none;margin:16px 0 0;padding:0}
.list li+li{margin-top:6px}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:0 12px;align-items:center;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);padding:10px 12px 10px 10px}
.row.is-today{box-shadow:0 0 0 2px var(--c)}
.row .rd{font-weight:500;font-size:17px;line-height:1.2;color:var(--c);font-variant-numeric:tabular-nums}
.row .rd small{display:block;font-weight:400;font-size:12px;color:var(--ink-dim)}
.row .rt{font-size:15.5px;line-height:1.45}
.row .rt small{display:block;font-size:12.5px;color:var(--ink-dim)}
.row .ra{width:8px;height:8px;border-right:1.5px solid var(--ink-dim);border-top:1.5px solid var(--ink-dim);transform:rotate(45deg)}

/* 章節標題 */
.h{display:flex;align-items:baseline;gap:10px;margin:26px 0 8px}
.h h2,.h h3{font-family:var(--head);font-weight:900;margin:0;letter-spacing:.05em}
.h h2{font-size:26px} .h h3{font-size:20px}
.h span{font-size:13.5px;color:var(--ink-dim)}
.lead{color:var(--ink-dim);font-size:15px;margin:4px 0 14px}

/* 狀態標籤 */
.st,.tg{display:inline-block;font-size:12px;font-weight:500;letter-spacing:.03em;line-height:1.6;padding:0 7px;border-radius:2px;white-space:nowrap;vertical-align:1px}
.st-booked{background:var(--ok-bg);color:var(--ok)}
.st-pending{background:var(--wait-bg);color:var(--wait)}
.st-self{background:var(--self-bg);color:var(--self)}
.tg-bad{background:var(--bad-bg);color:var(--bad)}
.tg-dim{background:var(--line-soft);color:var(--ink-dim)}
.who{display:inline-block;font-size:12px;line-height:1.6;padding:0 6px;border:1px solid var(--line);border-radius:2px;color:var(--ink-dim);margin-right:6px;vertical-align:1px}

/* 單日頁 */
.dayhead{background:var(--paper);border-bottom:4px solid var(--c)}
.dayhead .wrap{display:flex;align-items:flex-end;gap:12px;padding-top:16px;padding-bottom:12px}
.dd{font-family:var(--head);font-weight:900;font-size:38px;line-height:1;color:var(--c)}
.dd small{font-family:var(--sans);font-weight:400;font-size:14px;color:var(--ink-dim);margin-left:8px}
.loc{margin-left:auto;text-align:right;line-height:1.35}
.loc b{display:block;font-weight:500;font-size:17px}
.loc span{font-size:12.5px;color:var(--ink-dim)}
.daytitle{margin:0;padding:0 0 12px;font-size:15px;color:var(--ink-dim)}
.pager{display:flex;justify-content:space-between;gap:10px;margin:14px 0}
.pager a{flex:1;display:flex;align-items:center;justify-content:center;min-height:42px;border:1px solid var(--line);background:var(--paper);text-decoration:none;font-size:14.5px;border-radius:3px}
.pager a[aria-disabled="true"]{visibility:hidden}
.banner{background:var(--self-bg);color:var(--self);padding:9px 12px;margin:12px 0 0;font-size:14.5px}

.card{background:var(--paper);border:1px solid var(--line);padding:12px 14px;margin:0 0 12px}
.card>.lab{font-size:13px;font-weight:500;letter-spacing:.1em;color:var(--c);margin:0 0 4px}

.evs{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:46px 26px minmax(0,1fr);gap:0 8px;padding:8px 0}
.ev-t{font-weight:500;font-size:15.5px;line-height:1.6;font-variant-numeric:tabular-nums;text-align:right}
.ev-n{position:relative;display:flex;justify-content:center}
.ev-n svg{width:24px;height:24px;padding:4px;border-radius:50%;background:var(--paper);border:1.5px solid var(--c);color:var(--c);position:relative;z-index:1;margin-top:1px}
.ev:not(:last-child) .ev-n::after{content:"";position:absolute;top:26px;bottom:-12px;left:50%;width:1px;background:var(--line)}
.ev-main{margin:0;font-size:16px;font-weight:500;line-height:1.55}
.ev-main .st{margin-left:6px}
.ev-sub{margin:2px 0 0;font-size:14.5px;color:var(--ink-dim);line-height:1.6}

.free{border-left:3px solid var(--c);padding:2px 0 2px 12px;margin:4px 0 10px}
.free b{display:block;font-size:15px;font-weight:500}
.free p{margin:2px 0 0;font-size:15px}
.plan{margin:6px 0 0;padding-left:1.1em;font-size:15.5px}
.plan li{margin:3px 0}
.dnote{background:var(--wait-bg);padding:9px 12px;margin:8px 0 0;font-size:14.5px;line-height:1.65}
.stay{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px}
.stay svg{width:20px;height:20px;color:var(--c);margin-top:3px}
.stay p{margin:0;font-size:15px;line-height:1.6}
.stay .s-sub{font-size:14px;color:var(--ink-dim)}
.lnk{color:var(--fjord);text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.chips a,.chips button{font-size:13.5px;text-decoration:none;color:var(--c);border:1px solid var(--line);background:var(--paper);padding:2px 10px;border-radius:2px;cursor:pointer;line-height:1.7}
.chips button[aria-pressed="true"]{background:var(--c);color:var(--paper);border-color:var(--c)}

/* 區域與地點 */
details.area{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);margin:0 0 10px}
details.area>summary{list-style:none;cursor:pointer;padding:11px 40px 11px 13px;position:relative}
details.area>summary::-webkit-details-marker{display:none}
details.area>summary b{display:block;font-weight:500;font-size:16px;line-height:1.45}
details.area>summary span{font-size:13.5px;color:var(--ink-dim)}
.chev{position:absolute;right:16px;top:18px;width:9px;height:9px;border-right:1.5px solid var(--ink-dim);border-bottom:1.5px solid var(--ink-dim);transform:rotate(45deg);transition:transform .2s}
details[open]>summary .chev{transform:rotate(-135deg);top:22px}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.pois{list-style:none;margin:0;padding:0 13px 6px;border-top:1px solid var(--line-soft)}
.poi{padding:11px 0;border-top:1px solid var(--line-soft)}
.poi:first-child{border-top:none}
.poi-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.poi-h b{font-weight:500;font-size:16px}
.ty{font-size:12px;font-weight:500;padding:0 6px;border-radius:2px;line-height:1.6}
.ty-sight{background:var(--self-bg);color:var(--self)}
.ty-food{background:var(--bad-bg);color:var(--bad)}
.ty-cafe{background:var(--wait-bg);color:var(--wait)}
.poi .local{font-size:13px;color:var(--ink-dim);margin:1px 0 0}
.poi p{margin:4px 0 0;font-size:15px;line-height:1.65}
.poi .meta{font-size:13.5px;color:var(--ink-dim)}
.poi .tip{font-size:14px;color:var(--ink-dim);border-left:2px solid var(--line);padding-left:9px}
.poi .acts{display:flex;gap:14px;margin-top:5px;font-size:13.5px}
.poi[hidden]{display:none}

/* 地點介紹卡（其他城市） */
details.place{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);margin:0 0 10px}
details.place>summary{list-style:none;cursor:pointer;padding:12px 40px 12px 13px;position:relative}
details.place>summary::-webkit-details-marker{display:none}
.p-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p-top h3{font-family:var(--head);font-weight:700;font-size:19px;margin:0;line-height:1.35}
.p-line{margin:3px 0 0;color:var(--ink-dim);font-size:14.5px;line-height:1.6}
.tier-must{background:var(--ok-bg);color:var(--ok)}
.tier-worth{background:var(--self-bg);color:var(--self)}
.tier-maybe{background:var(--wait-bg);color:var(--wait)}
.body{padding:2px 13px 12px;border-top:1px solid var(--line-soft);font-size:15.5px}
.body h4{font-size:13.5px;font-weight:500;letter-spacing:.1em;color:var(--c);margin:14px 0 4px}
.body p{margin:0 0 8px}
.body ul{margin:0 0 8px;padding-left:1.1em}
.body li{margin:4px 0}
.body b{font-weight:500}
.quote{border-left:2px solid var(--c);padding:1px 0 1px 12px;color:var(--ink-dim);margin:6px 0 10px;font-family:var(--head)}
.note{background:var(--wait-bg);padding:10px 12px;margin:10px 0 2px;font-size:14.5px;line-height:1.65}
.subp{border-top:1px solid var(--line-soft);padding:9px 0 2px;margin:4px 0}
.subp b{display:block;font-family:var(--head);font-weight:700;font-size:16px;margin-bottom:2px}
.stops{list-style:none;padding:0;margin:8px 0 10px;counter-reset:s}
.stops li{position:relative;padding:0 0 10px 32px;counter-increment:s;margin:0}
.stops li::before{content:counter(s);position:absolute;left:0;top:3px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--c);color:var(--c);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center}

/* 城市清單 */
.city{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);padding:13px 14px;margin:0 0 8px}
.city b{font-family:var(--head);font-weight:700;font-size:19px}
.city span{font-size:13px;color:var(--ink-dim)}
.tips{margin:0;padding-left:1.1em;font-size:14.5px}
.tips li{margin:5px 0}

/* 資訊、交通、筆記 */
.seg{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);padding:10px 14px 11px;margin:0 0 8px}
.seg-top{display:flex;justify-content:space-between;align-items:baseline;gap:2px 12px;flex-wrap:wrap}
.seg-top b{font-weight:500;font-size:16px}
.seg-top span{font-size:13px;color:var(--ink-dim)}
.seg dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 14px;margin:5px 0 0;font-size:14.5px;line-height:1.65}
.seg dt{color:var(--ink-dim);font-size:13px;line-height:1.85}
.seg dd{margin:0}
.box{background:var(--paper);border:1px solid var(--line);padding:12px 14px;margin:0 0 12px}
.box h3{font-size:16px;font-weight:500;margin:0 0 6px}
.box ul{margin:0;padding-left:1.1em;font-size:15px}
.box li{margin:4px 0}
.rows{margin:0}
.rows div{border-top:1px solid var(--line-soft);padding:6px 0}
.rows div:first-child{border-top:none;padding-top:0}
.rows dt{font-size:13.5px;color:var(--ink-dim)}
.rows dd{margin:0;font-size:15px}
.skip li{margin:0 0 10px}
.alt{color:var(--ok)}
.foot{margin:28px 0 10px;font-size:12.5px;color:var(--ink-dim)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1 id="title">北境冬旅</h1>
    <button type="button" class="mode" id="mode" aria-pressed="false" title="極光觀測模式：暗紅色低亮度"><i></i><span>觀測</span></button>
  </div>
</header>

<div id="view"></div>

<nav class="tabs" aria-label="分頁">
  <div class="wrap">
    <a href="#/today" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>今天</a>
    <a href="#/days" data-tab="days"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>行程</a>
    <a href="#/city" data-tab="city"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>城市</a>
    <a href="#/info" data-tab="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>資訊</a>
    <a href="#/notes" data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h9l4 4v13H6z"/><path d="M15 3.5v4h4M9 12h7M9 15.5h7"/></svg>筆記</a>
  </div>
</nav>

<script src="data.js"></script>
<script>
(function(){
  var T = window.TRIP, view = document.getElementById("view"), titleEl = document.getElementById("title");
  var WD = ["日","一","二","三","四","五","六"];
  var COLOR = { ink:"var(--ink-dim)", brick:"var(--brick)", fjord:"var(--fjord)", aurora:"var(--aurora)" };
  var TYPE = { sight:"景點", food:"吃", cafe:"咖啡" };
  var TIER = { must:"必去", worth:"值得", maybe:"看情況" };
  var ICON = {
    flight:'<path fill="currentColor" d="M21 15.5v-1.7l-7.5-4.6V4.3a1.5 1.5 0 0 0-3 0v4.9L3 13.8v1.7l7.5-2.3v4.6l-2 1.4V20.5l3.5-1 3.5 1v-1.3l-2-1.4v-4.6z"/>',
    train:'<g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="6" y="3.5" width="12" height="13" rx="2.5"/><path d="M6 11h12M9 20l-1.5 1.5M15 20l1.5 1.5"/></g>',
    car:'<g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 16v-3.5l2-5h12l2 5V16z"/><path d="M4 12.5h16"/><circle cx="8" cy="16.5" r="1.6" fill="currentColor"/><circle cx="16" cy="16.5" r="1.6" fill="currentColor"/></g>',
    taxi:'<g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 16v-3.5l2-5h12l2 5V16z"/><path d="M10 7.5V5.5h4v2"/><circle cx="8" cy="16.5" r="1.6" fill="currentColor"/><circle cx="16" cy="16.5" r="1.6" fill="currentColor"/></g>',
    tour:'<g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 18l5.5-9 3.5 5 2.5-3.5L21 18z"/><path d="M3 21h18"/></g>',
    bed:'<g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19V6M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11.5" r="1.8"/></g>'
  };
  function svg(k){ return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICON[k]||ICON.tour)+'</svg>'; }

  /* 日期工具 */
  function parse(iso){ var p=iso.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
  function md(iso){ var d=parse(iso); return (d.getMonth()+1)+"/"+d.getDate(); }
  function wd(iso){ return "週"+WD[parse(iso).getDay()]; }
  function dow(iso){ return parse(iso).getDay(); }
  function diff(a,b){ var x=parse(a),y=parse(b); return Math.round((Date.UTC(y.getFullYear(),y.getMonth(),y.getDate())-Date.UTC(x.getFullYear(),x.getMonth(),x.getDate()))/864e5); }
  function add(iso,n){ var d=parse(iso); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function key(iso){ return iso.slice(5).replace("-",""); }
  function byKey(k){ return T.days.filter(function(d){ return key(d.date)===k; })[0]; }

  function col(region){ var r=T.regions[region]; return COLOR[(r&&r.color)||"ink"]; }
  function who(w){ return w ? '<span class="who">'+T.people[w]+'</span>' : ""; }
  function st(s,text){ if(!s) return ""; return '<span class="st st-'+s+'">'+(text||({booked:"已訂",pending:"待訂",self:"May 自訂"})[s])+'</span>'; }
  function km(a,b){ var R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;
    var h=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);
    return 2*R*Math.asin(Math.sqrt(h)); }
  function mapURL(q){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q); }

  var today = todayISO(), inTrip = today>=T.start && today<=T.end;

  /* 住宿 */
  function staysOn(iso){ return T.stays.filter(function(s){ return iso>=s.from && iso<add(s.from,s.nights); }); }
  function stayById(id){ return T.stays.filter(function(s){return s.id===id;})[0]; }

  /* ── 元件 ── */
  function legHTML(l){
    var main, subs=[];
    if (l.t==="flight"){
      main = who(l.who)+l.from+" → "+l.to;
      var a=[l.carrier+(l.no?" "+l.no:"")];
      if (l.fromNote||l.toNote) a.push((l.fromNote||"")+(l.fromNote&&l.toNote?" → ":"")+(l.toNote||""));
      if (l.via) a.push("中途停"+l.via);
      subs.push(a.join("，"));
      subs.push((l.arr? l.arr+" 抵達"+(l.plus?"（隔天）":""):"")+(l.depNote?(l.arr?"，":"")+l.depNote:""));
      if (l.bag) subs.push("行李："+l.bag);
    } else {
      main = who(l.who)+l.text;
      if (l.arr) subs.push(l.arr+" 回到出發地");
    }
    return '<li class="ev"><span class="ev-t">'+(l.dep||"—")+'</span><span class="ev-n">'+svg(l.t)+'</span><div><p class="ev-main">'+main+st(l.status,l.statusText)+'</p>'+
      subs.filter(Boolean).map(function(s){return '<p class="ev-sub">'+s+'</p>';}).join("")+'</div></li>';
  }
  function stayHTML(s, iso){
    var n=diff(s.from,iso)+1, lines=[];
    if (s.name) lines.push(s.name);
    if (s.address) lines.push('<a class="lnk" href="'+mapURL((s.name?s.name+" ":"")+s.address)+'" target="_blank" rel="noopener">'+s.address+'</a>');
    if (s.note && n===1) lines.push(s.note);
    return '<div class="stay">'+svg("bed")+'<div><p>'+who(s.who)+'住'+s.area+'，第 '+n+' 晚／共 '+s.nights+' 晚 '+st(s.status)+'</p>'+
      lines.map(function(t){return '<p class="s-sub">'+t+'</p>';}).join("")+'</div></div>';
  }
  function poiHTML(p, ctx){
    var tags="", meta=[];
    if (p.warn) tags+=' <span class="tg tg-bad">'+p.warn+'</span>';
    else if (ctx.date && p.closed && p.closed.indexOf(dow(ctx.date))>-1) tags+=' <span class="tg tg-bad">當天公休</span>';
    if (p.time) meta.push("約 "+p.time);
    if (ctx.from && p.lat) meta.push("離"+ctx.fromName+"直線約 "+km(ctx.from,p).toFixed(1)+" 公里");
    var info=[];
    if (p.hours) info.push(p.hours);
    if (p.closed && p.closed.length && !p.warn) info.push(p.closed.map(function(n){return "週"+WD[n];}).join("、")+"休");
    if (p.free) info.push(p.free);
    return '<li class="poi" data-type="'+p.type+'"><div class="poi-h"><span class="ty ty-'+p.type+'">'+TYPE[p.type]+'</span><b>'+p.name+'</b>'+tags+'</div>'+
      (p.local?'<p class="local">'+p.local+'</p>':"")+'<p>'+p.line+'</p>'+
      (info.length?'<p class="meta">'+info.join("；")+'</p>':"")+
      (meta.length?'<p class="meta">'+meta.join("，")+'</p>':"")+
      (p.tip?'<p class="tip">'+p.tip+'</p>':"")+
      '<div class="acts"><a class="lnk" href="'+mapURL(p.q||((p.local||p.name)+" "+(ctx.mapCity||"")))+'" target="_blank" rel="noopener">地圖</a></div></li>';
  }
  function areaHTML(city, area, ctx, open){
    var list = city.pois.filter(function(p){ return p.area===area.id; });
    return '<details class="area" style="--c:'+col(city.region)+'"'+(open?" open":"")+'><summary><b>'+area.name+'</b><span>'+area.line+'　'+list.length+' 個地點</span><span class="chev" aria-hidden="true"></span></summary>'+
      '<ul class="pois">'+list.map(function(p){return poiHTML(p,ctx);}).join("")+'</ul></details>';
  }
  function blocksHTML(bs){
    return bs.map(function(b){
      var h=b.h?"<h4>"+b.h+"</h4>":"";
      if (b.sub) return '<div class="subp"><b>'+b.sub+'</b>'+b.p+'</div>';
      if (b.list) return h+"<ul>"+b.list.map(function(i){return "<li>"+i+"</li>";}).join("")+"</ul>";
      if (b.stops) return h+'<ol class="stops">'+b.stops.map(function(i){return "<li>"+i+"</li>";}).join("")+"</ol>";
      if (b.quote) return h+'<p class="quote">'+b.quote+'</p>';
      if (b.note) return '<div class="note">'+b.note+'</div>';
      return h+"<p>"+b.p+"</p>";
    }).join("");
  }
  function placeHTML(p, id){
    var c = p.region?col(p.region):(p.polar?"var(--aurora)":"var(--ink-dim)");
    return '<details class="place"'+(id?' id="'+id+'"':"")+' style="--c:'+c+'"><summary><div class="p-top"><h3>'+p.name+'</h3><span class="tg tier-'+p.tier+'">'+TIER[p.tier]+'</span>'+
      (p.polar?'<span class="tg tg-dim">極光區</span>':"")+'</div><p class="p-line">'+p.line+'</p><span class="chev" aria-hidden="true"></span></summary><div class="body">'+blocksHTML(p.blocks)+'</div></details>';
  }
  function placeById(id){ return T.places.filter(function(p){return p.id===id;})[0]; }

  /* ── 頁面 ── */
  function pageDays(){
    titleEl.textContent = "行程總覽";
    var status;
    if (today<T.start) status = "距離出發：Yulun 還有 "+diff(today,T.departures.Y)+" 天，May 還有 "+diff(today,T.departures.M)+" 天";
    else if (inTrip){ var td=T.days.filter(function(d){return d.date===today;})[0]; status = "今天 "+md(today)+" "+wd(today)+"，旅程第 "+(diff(T.start,today)+1)+" 天"+(td?"，在"+T.regions[td.region].name:""); }
    else status = "旅程已結束，歡迎回家。";
    var route = T.route.map(function(r){ return '<li class="'+(r.polar?"polar":"")+(r.solo?" solo":"")+'"><b>'+r.name+'</b><span>'+r.nights+'</span></li>'; }).join("");
    var rows = T.days.map(function(d){
      return '<li><a class="row'+(d.date===today?" is-today":"")+'" href="#/day/'+key(d.date)+'" style="--c:'+col(d.region)+'"><span class="rd">'+md(d.date)+'<small>'+wd(d.date)+'</small></span>'+
        '<span class="rt">'+d.title+'<small>'+T.regions[d.region].name+'，第 '+(diff(T.start,d.date)+1)+' 天</small></span><span class="ra" aria-hidden="true"></span></a></li>';
    }).join("");
    return '<section class="sky"><svg viewBox="0 0 400 80" preserveAspectRatio="none" aria-hidden="true"><g class="drift"><path class="a1" d="M-30,58 C60,24 130,68 210,38 S330,12 430,32" stroke-width="2.4"/><path class="a2" d="M-30,66 C70,36 140,76 220,48 S340,22 430,42" stroke-width="1.4"/></g><g class="drift2"><path class="a3" d="M-30,50 C50,18 120,58 200,30 S320,4 430,22" stroke-width="1"/></g></svg>'+
      '<div class="wrap t"><h2>北境冬旅</h2><p class="sub">北歐＋波蘭旅遊手冊，2027/2/25～3/17</p><p class="status">'+status+'</p><div class="route"><ol>'+route+'</ol></div></div></section>'+
      '<main class="wrap"><ul class="list">'+rows+'</ul><p class="foot">資料更新於 '+T.updated.replace(/-/g,"/")+'。訂位代號和確認號不放在這個公開頁面。</p></main>';
  }

  function pageDay(k){
    var d = byKey(k); if (!d) return pageDays();
    var i = T.days.indexOf(d), prev=T.days[i-1], next=T.days[i+1], c=col(d.region);
    titleEl.textContent = md(d.date)+" "+T.regions[d.region].name;
    var city = T.cities[d.city], html="";
    if (d.legs && d.legs.length) html += '<div class="card" style="--c:'+c+'"><p class="lab">固定行程</p><ol class="evs">'+d.legs.map(legHTML).join("")+'</ol></div>';
    var stays = staysOn(d.date), ref = stays.filter(function(s){return s.lat;})[0];
    if (d.free){
      var ctx = { date:d.date, from: ref?{lat:ref.lat,lng:ref.lng}:null, fromName:"住處", mapCity: city&&city.mapCity };
      d.free.forEach(function(f){
        html += '<div class="card" style="--c:'+c+'"><p class="lab">自由時段</p><div class="free"><b>'+who(f.who)+f.when+'</b><p>'+f.text+'</p></div>';
        if (city && f.areas) html += '<p class="lab" style="margin-top:10px">可以去的區域</p>'+f.areas.map(function(a){ return areaHTML(city, city.areas.filter(function(x){return x.id===a;})[0], ctx, false); }).join("");
        html += '</div>';
      });
    }
    if (d.plan) html += '<div class="card" style="--c:'+c+'"><p class="lab">安排</p><ul class="plan">'+d.plan.map(function(p){return "<li>"+p+"</li>";}).join("")+'</ul></div>';
    if (d.notes) html += d.notes.map(function(n){return '<p class="dnote">'+n+'</p>';}).join("");
    if (stays.length) html += '<div class="card" style="--c:'+c+';margin-top:12px"><p class="lab">住宿</p>'+stays.map(function(s){return stayHTML(s,d.date);}).join("")+'</div>';
    var links = [];
    if (city && city.areas) links.push('<a href="#/city/'+d.city+'">'+city.name+'城市頁</a>');
    (d.places||[]).forEach(function(id){ var p=placeById(id); if(p) links.push('<a href="#/place/'+id+'">'+p.name+'介紹</a>'); });
    if (links.length) html += '<div class="chips" style="--c:'+c+'">'+links.join("")+'</div>';
    var banner = (!inTrip && today<T.start && d.date===T.start && location.hash.indexOf("today")>-1) ? '<p class="banner">還沒出發，先顯示第一天。</p>' : "";
    var pager = '<div class="pager">'+(prev?'<a href="#/day/'+key(prev.date)+'">‹ '+md(prev.date)+'</a>':'<a aria-disabled="true">‹</a>')+(next?'<a href="#/day/'+key(next.date)+'">'+md(next.date)+' ›</a>':'<a aria-disabled="true">›</a>')+'</div>';
    return '<section class="dayhead" style="--c:'+c+'"><div class="wrap"><div class="dd">'+md(d.date)+'<small>'+wd(d.date)+'</small></div><div class="loc"><b>'+T.regions[d.region].name+'</b><span>第 '+(diff(T.start,d.date)+1)+' 天</span></div></div>'+
      '<div class="wrap"><p class="daytitle">'+d.title+'</p></div></section><main class="wrap">'+banner+pager+html+pager+'</main>';
  }

  function pageCities(){
    titleEl.textContent = "城市";
    return '<main class="wrap"><div class="h"><h2>城市</h2><span>依路線順序</span></div>'+T.cityOrder.map(function(id){
      var c=T.cities[id], n = c.pois? c.pois.length+" 個地點" : "地點介紹";
      return '<a class="city" href="#/city/'+id+'" style="--c:'+col(c.region)+'"><b>'+c.name+'</b><span>'+n+'</span></a>';
    }).join("")+'<p class="lead">華沙是樣板，其他城市的區域和店家之後陸續補上。</p></main>';
  }

  var filter = "all";
  function pageCity(id){
    var c=T.cities[id]; if(!c) return pageCities();
    titleEl.textContent = c.name;
    var html = '<main class="wrap" style="--c:'+col(c.region)+'"><div class="h"><h2>'+c.name+'</h2></div>';
    if (c.intro) html += '<p class="lead">'+c.intro+'</p>';
    if (c.tips) html += '<div class="box"><h3>要先知道的事</h3><ul class="tips">'+c.tips.map(function(t){return "<li>"+t+"</li>";}).join("")+'</ul></div>';
    if (c.areas){
      var ref = stayById(c.ref), ctx = { date:null, from: ref&&ref.lat?{lat:ref.lat,lng:ref.lng}:null, fromName: ref?" "+ref.name.replace(/ Warsaw.*$/,"")+" ":"", mapCity: c.mapCity };
      html += '<div class="chips" id="filter">'+[["all","全部"],["sight","景點"],["food","吃"],["cafe","咖啡"]].map(function(f){
        return '<button type="button" data-f="'+f[0]+'" aria-pressed="'+(filter===f[0])+'">'+f[1]+'</button>'; }).join("")+'</div><div style="height:10px"></div>';
      html += c.areas.map(function(a){ return areaHTML(c,a,ctx,true); }).join("");
    }
    if (c.places) html += '<div class="h"><h3>地點介紹</h3><span>區域和店家待整理</span></div>'+c.places.map(function(pid){ return placeHTML(placeById(pid)); }).join("");
    return html+'</main>';
  }
  function applyFilter(){
    document.querySelectorAll(".poi").forEach(function(el){ el.hidden = !(filter==="all" || el.getAttribute("data-type")===filter); });
    document.querySelectorAll("#filter button").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-f")===filter); });
  }

  function pagePlace(id){
    var p=placeById(id); if(!p) return pageCities();
    titleEl.textContent = p.name;
    return '<main class="wrap"><div style="height:14px"></div>'+placeHTML(p).replace("<details ","<details open ")+'</main>';
  }

  function pageInfo(){
    titleEl.textContent = "資訊";
    var segs=[];
    T.days.forEach(function(d){ (d.legs||[]).forEach(function(l){ if(/flight|train|tour/.test(l.t)) segs.push({d:d,l:l}); }); });
    var tr = segs.map(function(x){
      var l=x.l, rows=[];
      if (l.t==="flight") rows.push(["航班", l.carrier+(l.no?" "+l.no:"")+(l.via?"，中途停"+l.via:"")]);
      rows.push(["時間", (l.dep||"—")+" → "+(l.arr||"—")+(l.plus?"（隔天）":"")]);
      if (l.bag) rows.push(["行李", l.bag]);
      rows.push(["狀態", st(l.status,l.statusText)]);
      if (l.price) rows.push(["價格", l.price]);
      return '<div class="seg" style="--c:'+col(x.d.region)+'"><div class="seg-top"><b>'+who(l.who)+(l.t==="flight"?l.from+" → "+l.to:l.text)+'</b><span>'+md(x.d.date)+" "+wd(x.d.date)+'</span></div><dl>'+
        rows.map(function(r){return "<dt>"+r[0]+"</dt><dd>"+r[1]+"</dd>";}).join("")+'</dl></div>';
    }).join("");
    return '<main class="wrap"><div class="h"><h2>資訊</h2><span>出發前會陸續補齊</span></div>'+
      '<div class="box"><h3>行李限額</h3><dl class="rows">'+T.info.baggage.map(function(b){return "<div><dt>"+b.seg+"</dt><dd>"+b.text+"</dd></div>";}).join("")+'</dl></div>'+
      '<div class="box"><h3>之後會加入</h3><ul>'+T.info.coming.map(function(c){return "<li>"+c+"</li>";}).join("")+'</ul></div>'+
      '<div class="h"><h3>交通總表</h3><span>每人價格，查價當時的參考值</span></div>'+tr+
      '<p class="foot">挪威克朗以 1 克朗約台幣 3.34 元、茲羅提以 1 元約台幣 8 元概算，實際以官網和訂購時為準。</p></main>';
  }

  function pageNotes(){
    titleEl.textContent = "規劃筆記";
    function li(a){ return a.map(function(t){return "<li>"+t+"</li>";}).join(""); }
    return '<main class="wrap"><div class="h"><h2>規劃筆記</h2><span>行程定案後刪除</span></div>'+
      '<div class="box"><h3>還在等的決定</h3><ul>'+li(T.notes.pending)+'</ul></div>'+
      '<div class="box"><h3>交通費用（每人）</h3><ul>'+li(T.notes.cost)+'</ul></div>'+
      '<p class="lead">沒排進路線、但討論過的地方：</p>'+T.notes.places.map(function(p){return placeHTML(p);}).join("")+
      '<div class="box"><h3>不推薦</h3><ul class="skip">'+T.notes.skip.map(function(s){return "<li><b>"+s.name+"</b>："+s.text+(s.alt?'<br><span class="alt">替代：'+s.alt+"</span>":"")+"</li>";}).join("")+'</ul></div></main>';
  }

  /* ── 路由 ── */
  var current = "";
  function route(){
    var h = location.hash.replace(/^#\/?/,""), parts=h.split("/"), tab, html;
    if (!h){ h = inTrip ? "day/"+key(today) : "days"; parts=h.split("/"); }
    switch(parts[0]){
      case "today": tab="today"; html = pageDay(key(inTrip?today:T.start)); break;
      case "day": tab = (inTrip && parts[1]===key(today)) ? "today" : "days"; html = pageDay(parts[1]); break;
      case "city": tab="city"; html = parts[1]?pageCity(parts[1]):pageCities(); break;
      case "place": tab="city"; html = pagePlace(parts[1]); break;
      case "info": tab="info"; html = pageInfo(); break;
      case "notes": tab="notes"; html = pageNotes(); break;
      default: tab="days"; html = pageDays();
    }
    view.innerHTML = html;
    if (document.getElementById("filter")) applyFilter();
    document.querySelectorAll(".tabs a").forEach(function(a){ if (a.getAttribute("data-tab")===tab) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
    if (h!==current) window.scrollTo(0,0);
    current = h;
  }
  window.addEventListener("hashchange", route);
  document.addEventListener("click", function(e){
    var b = e.target.closest("#filter button"); if (b){ filter=b.getAttribute("data-f"); applyFilter(); }
  });

  /* 單日頁左右滑 */
  var sx=null, sy=null;
  view.addEventListener("touchstart", function(e){ if (!/^#\/(day|today)/.test(location.hash) && location.hash) { sx=null; return; }
    if (e.target.closest(".chips,a,button,summary")) { sx=null; return; }
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
  view.addEventListener("touchend", function(e){
    if (sx===null) return;
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
    if (Math.abs(dx)<70 || Math.abs(dy)>45) return;
    var a = document.querySelectorAll(".pager")[0].querySelectorAll("a")[dx<0?1:0];
    if (a && a.getAttribute("href")) location.hash = a.getAttribute("href");
  }, {passive:true});

  /* 觀測模式 */
  var btn=document.getElementById("mode"), root=document.documentElement;
  function setMode(on){
    if (on) root.setAttribute("data-mode","red"); else root.removeAttribute("data-mode");
    btn.setAttribute("aria-pressed", on?"true":"false");
    btn.querySelector("span").textContent = on?"一般":"觀測";
    try{ localStorage.setItem("mode", on?"red":""); }catch(e){}
  }
  try{ if (localStorage.getItem("mode")==="red") setMode(true); }catch(e){}
  btn.addEventListener("click", function(){ setMode(root.getAttribute("data-mode")!=="red"); });

  route();
  if ("serviceWorker" in navigator && location.protocol.indexOf("http")===0) navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
